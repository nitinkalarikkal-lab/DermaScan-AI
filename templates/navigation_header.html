<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0A2E5C;
            --secondary-color: #1D7A8C;
            --accent-color: #F28F3B;
            --light-bg: #F7F9FC;
            --dark-text: #1A1A2E;
            --light-text: #6B7280;
            --white: #FFFFFF;
            --gradient-1: linear-gradient(135deg, #0A2E5C 0%, #1D7A8C 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
        }

        /* ========== NAVIGATION HEADER STYLES ========== */
        .navigation-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .navigation-header.scrolled {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .nav-navbar {
            padding: 1.2rem 0;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: translateY(-2px);
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: var(--gradient-1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 1.3rem;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .logo-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .logo-subtitle {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: var(--dark-text);
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-color);
            transition: width 0.3s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--accent-color);
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-login {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 500;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: rgba(10, 46, 92, 0.05);
        }

        .btn-register,
        .btn-action {
            text-decoration: none;
            color: var(--white);
            background: var(--gradient-1);
            font-weight: 600;
            padding: 0.7rem 1.8rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(10, 46, 92, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-register:hover,
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(10, 46, 92, 0.3);
        }

        .register-dropdown {
            position: relative;
        }

        .register-dropdown .btn-register {
            display: flex;
            align-items: center;
            cursor: pointer;
            border: none;
            background: var(--gradient-1);
        }

        .register-dropdown-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 1000;
            overflow: hidden;
        }

        .register-dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .register-dropdown-menu .dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 1.5rem;
            color: var(--dark-text);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .register-dropdown-menu .dropdown-item:last-child {
            border-bottom: none;
        }

        .register-dropdown-menu .dropdown-item:hover {
            background: var(--light-bg);
            color: var(--accent-color);
            padding-left: 2rem;
        }

        .register-dropdown-menu .dropdown-item i {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .mobile-menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
        }

        .mobile-menu-toggle span {
            width: 25px;
            height: 3px;
            background: var(--primary-color);
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .mobile-menu-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(7px, 7px);
        }

        .mobile-menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .mobile-menu-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 85px;
            left: 0;
            right: 0;
            background: var(--white);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transform: translateY(-100%);
            opacity: 0;
            transition: all 0.3s ease;
            max-height: calc(100vh - 85px);
            overflow-y: auto;
        }

        .mobile-menu.active {
            transform: translateY(0);
            opacity: 1;
        }

        .mobile-menu-content {
            padding: 2rem;
        }

        .mobile-nav-link {
            display: block;
            padding: 1rem 0;
            text-decoration: none;
            color: var(--dark-text);
            font-weight: 500;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .mobile-nav-link:hover {
            color: var(--accent-color);
            padding-left: 1rem;
        }

        .mobile-actions {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .mobile-btn-login,
        .mobile-btn-register,
        .mobile-btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-align: center;
            text-decoration: none;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .mobile-btn-login {
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .mobile-btn-login:hover {
            background: var(--primary-color);
            color: var(--white);
        }

        .mobile-btn-register,
        .mobile-btn-action {
            color: var(--white);
            background: var(--gradient-1);
        }

        .mobile-register-section {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .mobile-register-section p {
            font-size: 0.85rem;
            color: var(--light-text);
            margin: 0;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1024px) {
            .nav-links {
                display: none;
            }

            .mobile-menu-toggle {
                display: flex;
            }

            .mobile-menu {
                display: block;
            }
        }

        @media (max-width: 768px) {
            .nav-container {
                padding: 0 1rem;
            }

            .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }

            .logo-title {
                font-size: 1.2rem;
            }

            .logo-subtitle {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <header class="navigation-header">
        <nav class="nav-navbar">
            <div class="nav-container">
                <div class="logo-section">
                    <a href="/" class="logo">
                        <div class="logo-icon">
                            <img src="/static/assets/img/dermascan-icon.svg" alt="DermaScan">
                        </div>
                        <div class="logo-text">
                            <span class="logo-title">DermaScan</span>
                            <span class="logo-subtitle">AI</span>
                        </div>
                    </a>
                </div>

                <div class="nav-links">
                    <a href="/" class="nav-link">Home</a>
                    <a href="/about/" class="nav-link">About</a>
{#                    <a href="/contact/" class="nav-link">Contact</a>#}
                </div>

                <div class="nav-actions">
                    <a href="/login_view/" class="btn-login">Login</a>
                    <div class="register-dropdown">
                        <button class="btn-register" id="navRegisterDropdownBtn">
                            Register
                            <i class="fas fa-chevron-down" style="margin-left: 0.4rem; font-size: 0.8rem;"></i>
                        </button>
                        <div class="register-dropdown-menu" id="navRegisterDropdownMenu">
                            <a href="/register/" class="dropdown-item">
                                <i class="fas fa-user-md"></i>
                                Doctor
                            </a>
                            <a href="/user_register/" class="dropdown-item">
                                <i class="fas fa-user"></i>
                                Patient
                            </a>
                        </div>
                    </div>
                    <button class="mobile-menu-toggle" id="navMobileMenuToggle">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Mobile Menu -->
        <div class="mobile-menu" id="navMobileMenu">
            <div class="mobile-menu-content">
                <a href="/" class="mobile-nav-link">Home</a>
                <a href="/about/" class="mobile-nav-link">About</a>
{#                <a href="/contact/" class="mobile-nav-link">Contact</a>#}
                <div class="mobile-actions">
                    <a href="/login_view/" class="mobile-btn-login">
                        <i class="fas fa-sign-in-alt"></i>
                        Login
                    </a>
                    <div class="mobile-register-section">
                        <p>Register As:</p>
                        <a href="/register/" class="mobile-btn-register">
                            <i class="fas fa-user-md"></i>
                            Doctor
                        </a>
                        <a href="/user_register/" class="mobile-btn-register">
                            <i class="fas fa-user"></i>
                            Patient
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <script>
        // Register dropdown toggle
        const navRegisterDropdownBtn = document.getElementById('navRegisterDropdownBtn');
        const navRegisterDropdownMenu = document.getElementById('navRegisterDropdownMenu');

        if (navRegisterDropdownBtn) {
            navRegisterDropdownBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                navRegisterDropdownMenu.classList.toggle('active');
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!navRegisterDropdownBtn.contains(e.target) && !navRegisterDropdownMenu.contains(e.target)) {
                    navRegisterDropdownMenu.classList.remove('active');
                }
            });
        }

        // Mobile menu toggle
        const navMobileMenuToggle = document.getElementById('navMobileMenuToggle');
        const navMobileMenu = document.getElementById('navMobileMenu');

        if (navMobileMenuToggle) {
            navMobileMenuToggle.addEventListener('click', () => {
                navMobileMenu.classList.toggle('active');
                navMobileMenuToggle.classList.toggle('active');
            });
        }

        // Close mobile menu when clicking on a link
        document.querySelectorAll('.mobile-nav-link').forEach(link => {
            link.addEventListener('click', () => {
                navMobileMenu.classList.remove('active');
                if (navMobileMenuToggle) {
                    navMobileMenuToggle.classList.remove('active');
                }
            });
        });

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const header = document.querySelector('.navigation-header');
            if (header) {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            }
        });
    </script>
</body>
</html>
