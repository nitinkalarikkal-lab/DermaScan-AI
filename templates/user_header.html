{% load static %}
<style>
    :root {
        --primary-color: #0A2E5C;
        --secondary-color: #1D7A8C;
        --accent-color: #F28F3B;
        --success-color: #10B981;
        --light-bg: #F7F9FC;
        --dark-text: #1A1A2E;
        --light-text: #6B7280;
        --white: #FFFFFF;
        --border-color: #E5E7EB;
        --gradient-1: linear-gradient(135deg, #0A2E5C 0%, #1D7A8C 100%);
    }

    /* ========== USER HEADER ========== */
    .user-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        z-index: 1000;
        background: var(--white);
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
    }

    .user-header.scrolled {
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.12);
    }

    .header-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0.8rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    /* Logo Section */
    .header-logo {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        text-decoration: none;
        transition: transform 0.3s ease;
    }

    .header-logo:hover {
        transform: translateY(-2px);
    }

    .logo-icon {
        width: 50px;
        height: 50px;
        background: var(--gradient-1);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--white);
        font-size: 1.5rem;
        box-shadow: 0 4px 15px rgba(10, 46, 92, 0.3);
    }

    .logo-text {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
    }

    .logo-title {
        font-family: 'Crimson Pro', serif;
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--primary-color);
    }

    .logo-subtitle {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 1.5px;
        color: var(--secondary-color);
        text-transform: uppercase;
    }

    /* Navigation */
    .header-nav {
        display: flex;
        align-items: center;
        gap: 0.3rem;
    }

    .nav-link {
        padding: 0.7rem 1.2rem;
        color: var(--dark-text);
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 10px;
        transition: all 0.3s ease;
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .nav-link i {
        font-size: 0.9rem;
        opacity: 0.7;
    }

    .nav-link:hover {
        background: var(--light-bg);
        color: var(--secondary-color);
    }

    .nav-link:hover i {
        opacity: 1;
    }

    .nav-link.active {
        background: rgba(29, 122, 140, 0.1);
        color: var(--secondary-color);
    }

    .nav-link.active::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 30px;
        height: 3px;
        background: var(--secondary-color);
        border-radius: 2px 2px 0 0;
    }

    /* Special Buttons */
    .nav-chatbot {
        margin-left: 0.5rem;
        padding: 0.7rem 1.5rem;
        background: var(--gradient-1);
        color: var(--white);
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(10, 46, 92, 0.3);
    }

    .nav-chatbot:hover {
        background: var(--gradient-1);
        color: var(--white);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(10, 46, 92, 0.4);
    }

    /* Profile Dropdown */
    .profile-dropdown-wrapper {
        position: relative;
        margin-left: 0.5rem;
    }

    .profile-btn {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        background: var(--white);
        border: 2px solid var(--border-color);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        color: var(--dark-text);
        font-weight: 600;
    }

    .profile-btn:hover {
        border-color: var(--secondary-color);
        background: var(--light-bg);
    }

    .profile-avatar {
        font-size: 1.8rem;
        color: var(--secondary-color);
        display: flex;
        align-items: center;
    }

    .profile-btn i.fa-chevron-down {
        font-size: 0.8rem;
        transition: transform 0.3s ease;
    }

    .profile-btn.active i.fa-chevron-down {
        transform: rotate(180deg);
    }

    .profile-dropdown {
        position: absolute;
        top: calc(100% + 0.5rem);
        right: 0;
        width: 280px;
        background: var(--white);
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s ease;
        z-index: 1001;
    }

    .profile-dropdown.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    .dropdown-header {
        padding: 1.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        background: var(--light-bg);
        border-radius: 12px 12px 0 0;
    }

    .dropdown-avatar {
        width: 50px;
        height: 50px;
        background: var(--gradient-1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--white);
        font-size: 1.8rem;
        flex-shrink: 0;
    }

    .dropdown-user-info h4 {
        font-size: 1rem;
        font-weight: 700;
        color: var(--primary-color);
        margin-bottom: 0.2rem;
    }

    .dropdown-user-info p {
        font-size: 0.85rem;
        color: var(--light-text);
        margin: 0;
    }

    .dropdown-divider {
        height: 1px;
        background: var(--border-color);
        margin: 0.5rem 0;
    }

    .dropdown-item {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.9rem 1.5rem;
        color: var(--dark-text);
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .dropdown-item:hover {
        background: var(--light-bg);
        color: var(--secondary-color);
    }

    .dropdown-item i {
        width: 20px;
        text-align: center;
        color: var(--light-text);
        transition: color 0.3s ease;
    }

    .dropdown-item:hover i {
        color: var(--secondary-color);
    }

    .dropdown-item.logout-item {
        color: var(--accent-color);
    }

    .dropdown-item.logout-item:hover {
        background: rgba(242, 143, 59, 0.1);
        color: var(--accent-color);
    }

    .dropdown-item.logout-item i {
        color: var(--accent-color);
    }

    /* Mobile Menu Toggle */
    .mobile-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 1.5rem;
        color: var(--primary-color);
        cursor: pointer;
        padding: 0.5rem;
    }

    .mobile-toggle:hover {
        color: var(--secondary-color);
    }

    /* Mobile Navigation */
    @media (max-width: 1024px) {
        .header-container {
            padding: 0.8rem 1.5rem;
        }

        .mobile-toggle {
            display: block;
        }

        .header-nav {
            position: fixed;
            top: 70px;
            right: -100%;
            width: 300px;
            height: calc(100vh - 70px);
            background: var(--white);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
            flex-direction: column;
            align-items: stretch;
            gap: 0;
            padding: 1.5rem;
            transition: right 0.3s ease;
            overflow-y: auto;
        }

        .header-nav.active {
            right: 0;
        }

        .nav-link {
            padding: 1rem 1.2rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
        }

        .nav-link.active::after {
            display: none;
        }

        .nav-chatbot {
            margin-left: 0;
            margin-top: 1rem;
            justify-content: center;
        }

        .profile-dropdown-wrapper {
            margin: 1rem 0 0 0;
            width: 100%;
        }

        .profile-btn {
            width: 100%;
            justify-content: center;
        }

        .profile-dropdown {
            position: static;
            width: 100%;
            box-shadow: none;
            margin-top: 0.5rem;
        }
    }

    @media (max-width: 768px) {
        .header-container {
            padding: 0.8rem 1rem;
        }

        .logo-text {
            display: none;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
        }

        .header-nav {
            width: 280px;
        }

        .nav-link {
            font-size: 0.9rem;
        }
    }

    /* Mobile Menu Overlay */
    .nav-overlay {
        display: none;
        position: fixed;
        top: 70px;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
    }

    .nav-overlay.active {
        display: block;
    }

    .nav-badge {
        position: absolute;
        top: 0;
        right: 0;
        transform: translate(25%, -25%);
        background-color: #ef4444;
        /* User Alert Red */
        color: white;
        font-size: 0.65rem;
        font-weight: 700;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 99px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 5px rgba(239, 68, 68, 0.4);
    }
</style>

<!-- User Header -->
<header class="user-header" id="userHeader">
    <div class="header-container">
        <!-- Logo -->
        <a href="/user_home/" class="header-logo">
            <div class="logo-icon">
                <img src="{% static 'assets/img/dermascan-icon.svg' %}" alt="DermaScan">
            </div>
            <div class="logo-text">
                <span class="logo-title">DermaScan</span>
                <span class="logo-subtitle">AI Platform</span>
            </div>
        </a>

        <!-- Navigation -->
        <nav class="header-nav" id="headerNav">
            <a href="/user_home/" class="nav-link active">
                <i class="fas fa-home"></i>
                Home
            </a>
            <a href="/view_doctors/" class="nav-link">
                <i class="fas fa-user-md"></i>
                Doctors
            </a>
            <a href="/view_bookings/" class="nav-link">
                <i class="fas fa-calendar-check"></i>
                Bookings
                {% if unread_count > 0 %}
                <span class="nav-badge">{{ unread_count }}</span>
                {% endif %}
            </a>
            <a href="/skin-predict/" class="nav-link">
                <i class="fas fa-camera"></i>
                Predict
            </a>
            <a href="/user_complaint/" class="nav-link">
                <i class="fas fa-exclamation-circle"></i>
                Complaint
            </a>
            <a href="/user_feedback/" class="nav-link">
                <i class="fas fa-star"></i>
                Feedback
            </a>

            <a href="/skin_chatbot/" class="nav-link nav-chatbot">
                <i class="fas fa-robot"></i>
                Chatbot
            </a>

            <!-- Profile Dropdown -->
            <div class="profile-dropdown-wrapper">
                <button class="profile-btn" id="profileBtn" aria-label="Open profile menu">
                    <div class="profile-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <i class="fas fa-chevron-down"></i>
                </button>

                <div class="profile-dropdown" id="profileDropdown">
                    <div class="dropdown-header">
                        <div class="dropdown-avatar">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <div class="dropdown-user-info">
                            <h4>{{ user.username }}</h4>
                            <p>{{ user.email }}</p>
                        </div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a href="/user_profile/" class="dropdown-item">
                        <i class="fas fa-user-edit"></i>
                        My Profile
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="/logout_view/" class="dropdown-item logout-item">
                        <i class="fas fa-sign-out-alt"></i>
                        Logout
                    </a>
                </div>
            </div>
        </nav>

        <!-- Mobile Toggle -->
        <button class="mobile-toggle" id="mobileToggle" aria-label="Open menu">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</header>

<!-- Mobile Menu Overlay -->
<div class="nav-overlay" id="navOverlay"></div>

<script>
    // Mobile menu toggle
    const mobileToggle = document.getElementById('mobileToggle');
    const headerNav = document.getElementById('headerNav');
    const navOverlay = document.getElementById('navOverlay');
    const toggleIcon = mobileToggle?.querySelector('i');

    if (mobileToggle && headerNav && navOverlay && toggleIcon) {
        mobileToggle.addEventListener('click', function () {
            headerNav.classList.toggle('active');
            navOverlay.classList.toggle('active');

            // Toggle icon
            if (headerNav.classList.contains('active')) {
                toggleIcon.classList.remove('fa-bars');
                toggleIcon.classList.add('fa-times');
            } else {
                toggleIcon.classList.remove('fa-times');
                toggleIcon.classList.add('fa-bars');
            }
        });

        // Close menu when clicking overlay
        navOverlay.addEventListener('click', function () {
            headerNav.classList.remove('active');
            navOverlay.classList.remove('active');
            toggleIcon.classList.remove('fa-times');
            toggleIcon.classList.add('fa-bars');
        });

        // Close menu when clicking a link
        const navLinks = headerNav.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', function () {
                if (window.innerWidth <= 1024) {
                    headerNav.classList.remove('active');
                    navOverlay.classList.remove('active');
                    toggleIcon.classList.remove('fa-times');
                    toggleIcon.classList.add('fa-bars');
                }
            });
        });
    }

    // Add scrolled class on scroll
    const userHeader = document.getElementById('userHeader');
    if (userHeader) {
        window.addEventListener('scroll', function () {
            if (window.scrollY > 50) {
                userHeader.classList.add('scrolled');
            } else {
                userHeader.classList.remove('scrolled');
            }
        });
    }

    // Set active link based on current page
    const currentPath = window.location.pathname;
    const allNavLinks = document.querySelectorAll('.nav-link:not(.nav-chatbot):not(.nav-logout)');

    if (allNavLinks.length > 0) {
        allNavLinks.forEach(link => {
            link.classList.remove('active');
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
            }
        });
    }

    // Profile dropdown functionality
    const profileBtn = document.getElementById('profileBtn');
    const profileDropdown = document.getElementById('profileDropdown');

    if (profileBtn && profileDropdown) {
        profileBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            this.classList.toggle('active');
            profileDropdown.classList.toggle('active');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function (e) {
            if (!profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
                profileBtn.classList.remove('active');
                profileDropdown.classList.remove('active');
            }
        });

        // Prevent dropdown from closing when clicking inside it
        profileDropdown.addEventListener('click', function (e) {
            e.stopPropagation();
        });
    }
</script>
