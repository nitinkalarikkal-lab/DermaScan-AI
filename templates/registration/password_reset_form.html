<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="/static/assets/img/dermascan-icon.svg" rel="icon" type="image/svg+xml">
    <link href="/static/assets/img/favicon.png" rel="icon" type="image/png">
    <link href="/static/assets/img/favicon.ico" rel="shortcut icon">
    <link href="/static/assets/img/apple-touch-icon.png" rel="apple-touch-icon">
    <style>
        body{font-family:Arial,Helvetica,sans-serif;background:#f7f9fc;margin:0;padding:0;}
        .wrap{max-width:520px;margin:48px auto;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px;}
        h1{margin:0 0 8px;font-size:22px;}
        p{margin:0 0 16px;color:#475569;line-height:1.5;}
        label{display:block;margin:14px 0 6px;font-weight:600;}
        input[type="email"]{width:100%;padding:12px 12px;border:1px solid #cbd5e1;border-radius:10px;}
        button{margin-top:16px;width:100%;padding:12px 14px;border:0;border-radius:10px;background:#0A2E5C;color:#fff;font-weight:700;cursor:pointer;}
        a{color:#1D7A8C;text-decoration:none;}
        .errors{margin:10px 0 0;color:#b91c1c;}
        .links{margin-top:14px;text-align:center;}
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Forgot your password?</h1>
        <p>Enter your account email and we’ll send you a secure link to reset your password.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.email.label_tag }}
            {{ form.email }}
            {% if form.email.errors %}
            <div class="errors">{{ form.email.errors }}</div>
            {% endif %}
            <button type="submit">Send reset link</button>
        </form>

        <div class="links">
            <a href="{% url 'login_view' %}">Back to login</a>
        </div>
    </div>
</body>
</html>
